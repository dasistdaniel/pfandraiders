# Läuft hinter dem Nginx Proxy Manager (externes Docker-Netz proxy-net).
# Der Server veröffentlicht keinen Host-Port; NPM erreicht ihn über den Container-Namen.
services:
  server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
      # Buildinfo für die Lobby-Anzeige; update.sh setzt beides aus git.
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_NUMBER: ${BUILD_NUMBER:-dev}
    container_name: pfandraiders-server
    restart: unless-stopped
    environment:
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS setzen, zum Beispiel https://dasistdaniel.github.io}
      # Optional; leer = Standardwert (siehe README)
      ROUND_MS: ${ROUND_MS:-}
      GRACE_MS: ${GRACE_MS:-}
      MAP_ID: ${MAP_ID:-}
    networks:
      - proxy-net
networks:
  proxy-net:
    external: true
