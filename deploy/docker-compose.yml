# Läuft hinter dem Nginx Proxy Manager (externes Docker-Netz proxy-net).
# Der Server veröffentlicht keinen Host-Port; NPM erreicht ihn über den Container-Namen.
services:
  server:
    build:
      context: ..
      dockerfile: packages/server/Dockerfile
    container_name: pfandraiders-server
    restart: unless-stopped
    environment:
      PORT: "8080"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS setzen, zum Beispiel https://dasistdaniel.github.io}
    networks:
      - proxy-net
networks:
  proxy-net:
    external: true
